<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>miSpy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <!-- ===== TRACK TAB ===== -->
    <section class="screen" data-screen="track">
      <header class="hd">
        <h1>miSpy</h1>
        <span class="hd-sub">mileage &amp; expenses</span>
      </header>

      <div class="live-card" id="liveCard">
        <div class="live-miles"><span id="liveMiles">0.00</span><small>mi</small></div>
        <div class="live-row">
          <div><span id="liveElapsed">00:00:00</span><small>elapsed</small></div>
          <div><span id="liveRemaining">--:--:--</span><small>remaining</small></div>
          <div><span id="liveSpeed">0.0</span><small>mph</small></div>
        </div>
        <div class="live-status" id="liveStatus">Idle</div>
      </div>

      <div class="panel" id="setupPanel">
        <label class="field">
          <span>Trip label</span>
          <input id="tripLabel" type="text" placeholder="e.g. Client visits" />
        </label>

        <span class="field-label">Track for</span>
        <div class="chips" id="durationChips">
          <button class="chip" data-min="180">3h</button>
          <button class="chip" data-min="210">3.5h</button>
          <button class="chip active" data-min="240">4h</button>
          <button class="chip" data-min="270">4.5h</button>
          <button class="chip" data-min="300">5h</button>
          <button class="chip" data-min="custom">Custom</button>
        </div>
        <label class="field hidden" id="customWrap">
          <span>Custom minutes</span>
          <input id="customMin" type="number" min="1" step="1" placeholder="minutes" />
        </label>

        <span class="field-label">Start</span>
        <div class="chips" id="startChips">
          <button class="chip active" data-start="now">Now</button>
          <button class="chip" data-start="pin">Pin a time</button>
        </div>
        <label class="field hidden" id="pinWrap">
          <span>Start at</span>
          <input id="pinTime" type="datetime-local" />
        </label>

        <button class="btn-primary" id="startBtn">Start tracking</button>
      </div>

      <div class="panel hidden" id="activePanel">
        <button class="btn-danger" id="stopBtn">Stop &amp; save</button>
      </div>
    </section>

    <!-- ===== TRIPS TAB ===== -->
    <section class="screen hidden" data-screen="trips">
      <header class="hd"><h1>Trips</h1></header>
      <div class="summary" id="tripsSummary"></div>
      <div class="list" id="tripsList"></div>
    </section>

    <!-- ===== EXPENSES TAB ===== -->
    <section class="screen hidden" data-screen="expenses">
      <header class="hd"><h1>Expenses</h1></header>
      <div class="panel">
        <div class="row2">
          <label class="field">
            <span>Amount</span>
            <input id="expAmount" type="number" min="0" step="0.01" placeholder="0.00" />
          </label>
          <label class="field">
            <span>Date</span>
            <input id="expDate" type="date" />
          </label>
        </div>
        <label class="field">
          <span>Category</span>
          <select id="expCategory">
            <option>Fuel</option>
            <option>Tolls</option>
            <option>Parking</option>
            <option>Maintenance</option>
            <option>Meals</option>
            <option>Other</option>
          </select>
        </label>
        <label class="field">
          <span>Note</span>
          <input id="expNote" type="text" placeholder="optional" />
        </label>
        <button class="btn-primary" id="addExpBtn">Add expense</button>
      </div>
      <div class="summary" id="expSummary"></div>
      <div class="list" id="expList"></div>
    </section>

    <!-- ===== SETTINGS TAB ===== -->
    <section class="screen hidden" data-screen="settings">
      <header class="hd"><h1>Settings</h1></header>
      <div class="panel">
        <label class="field">
          <span>Mileage rate (per mile)</span>
          <input id="rateInput" type="number" min="0" step="0.01" />
        </label>
        <p class="hint">Used to estimate reimbursement/deduction from tracked miles.</p>
        <button class="btn-secondary" id="saveRateBtn">Save rate</button>
      </div>
      <div class="panel">
        <button class="btn-secondary" id="exportBtn">Export all data (JSON)</button>
        <p class="hint">Everything is stored on this device only. Nothing leaves your phone.</p>
      </div>
    </section>
  </main>

  <!-- ===== ROUTE OVERLAY ===== -->
  <div class="overlay hidden" id="routeOverlay">
    <div class="overlay-bar">
      <button class="overlay-close" id="routeClose">‹ Back</button>
      <span id="routeTitle">Route</span>
      <span class="overlay-spacer"></span>
    </div>
    <canvas id="routeCanvas"></canvas>
    <div class="route-legend">
      <span><i style="background:#28c8a0"></i> start / slower</span>
      <span><i style="background:#ef5a6f"></i> end / faster</span>
    </div>
    <div class="route-stats" id="routeStats"></div>
  </div>

  <nav class="tabbar">
    <button class="tab active" data-tab="track">Track</button>
    <button class="tab" data-tab="trips">Trips</button>
    <button class="tab" data-tab="expenses">Expenses</button>
    <button class="tab" data-tab="settings">Settings</button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
