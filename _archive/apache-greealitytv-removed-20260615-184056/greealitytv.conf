<VirtualHost *:80>
    ServerName greealitytv.com
    ServerAlias www.greealitytv.com
    ServerAdmin scott@madladslab.com
    DocumentRoot /srv/greealitytv

  RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    # Reverse Proxy Setup
    ProxyPreserveHost On
    ProxyTimeout 600
    ProxyPass / http://104.237.138.28:3400/ timeout=600
    ProxyPassReverse / http://104.237.138.28:3400/

    <Directory "/srv/greealitytv">
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/greealitytv_error.log
    CustomLog ${APACHE_LOG_DIR}/greealitytv_access.log combined
    ErrorDocument 500 /500.html

    # HTTPS redirect disabled until certbot is run
    # RewriteEngine on
    # RewriteCond %{SERVER_NAME} =greealitytv.com [OR]
    # RewriteCond %{SERVER_NAME} =www.greealitytv.com
    # RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
RewriteEngine on
RewriteCond %{SERVER_NAME} =www.greealitytv.com [OR]
RewriteCond %{SERVER_NAME} =greealitytv.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
