<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Blackjack">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f6a45"/><stop offset="1" stop-color="#0a4d31"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="28" fill="url(#felt)"/>
  <circle cx="120" cy="120" r="92" fill="none" stroke="#ffe9a8" stroke-opacity="0.35" stroke-width="2"/>
  <!-- back card (spade) -->
  <g transform="translate(78 86) rotate(-14)">
    <rect x="-34" y="-46" width="68" height="92" rx="9" fill="#f6f3ea" stroke="#d8d2c0"/>
    <path d="M0 -22 C 16 -4, 22 6, 0 18 C -22 6, -16 -4, 0 -22 Z" fill="#16202b"/>
    <rect x="-3" y="12" width="6" height="12" fill="#16202b"/>
  </g>
  <!-- front card (red A) -->
  <g transform="translate(150 96) rotate(12)">
    <rect x="-34" y="-46" width="68" height="92" rx="9" fill="#fbf8f0" stroke="#e2d9c2"/>
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="46" fill="#c0392b">A</text>
    <text x="-24" y="-22" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c0392b">A</text>
  </g>
  <!-- payout banner -->
  <rect x="48" y="178" width="144" height="34" rx="17" fill="#06210f" stroke="#ffe9a8" stroke-opacity="0.6"/>
  <text x="120" y="201" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="18" fill="#ffe9a8">BLACKJACK</text>
</svg>
