<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="felt" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1b6b43"/>
      <stop offset="100%" stop-color="#0a3a24"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfdfb"/>
      <stop offset="100%" stop-color="#e9e7e0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="18" fill="url(#felt)"/>
  <rect x="8" y="8" width="384" height="284" rx="14" fill="none" stroke="#000" stroke-opacity="0.28" stroke-width="2"/>

  <!-- fanned cards -->
  <g filter="url(#sh)">
    <!-- back card: Queen of Spades -->
    <g transform="rotate(-16 150 170)">
      <rect x="108" y="92" width="92" height="132" rx="11" fill="url(#card)" stroke="#000" stroke-opacity="0.18"/>
      <text x="120" y="118" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#15171a">Q</text>
      <text x="120" y="140" font-family="system-ui, sans-serif" font-size="18" fill="#15171a">&#9824;</text>
      <text x="154" y="178" font-family="system-ui, sans-serif" font-size="52" fill="#15171a" text-anchor="middle">&#9824;</text>
    </g>
    <!-- front card: Ace of Hearts -->
    <g transform="rotate(12 252 168)">
      <rect x="206" y="86" width="96" height="138" rx="11" fill="url(#card)" stroke="#000" stroke-opacity="0.18"/>
      <text x="218" y="114" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#cf2f2a">A</text>
      <text x="218" y="138" font-family="system-ui, sans-serif" font-size="19" fill="#cf2f2a">&#9829;</text>
      <text x="254" y="176" font-family="system-ui, sans-serif" font-size="58" fill="#cf2f2a" text-anchor="middle">&#9829;</text>
    </g>
  </g>

  <!-- title -->
  <text x="200" y="50" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#f3efe0" text-anchor="middle" letter-spacing="3">HEARTS</text>
  <text x="200" y="270" font-family="system-ui, sans-serif" font-size="13" fill="#bfe0cd" text-anchor="middle" letter-spacing="1">avoid the points &#183; shoot the moon</text>
</svg>
