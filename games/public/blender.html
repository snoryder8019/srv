<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Blender · Model Scope</title>
<style>
  :root { --bg:#0a0a0a; --panel:#141417; --line:#26262b; --fg:#e5e5e5; --mut:#737380; --acc:#7c9cff; --danger:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; height:100dvh; display:flex; flex-direction:column; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); -webkit-text-size-adjust:100%; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.3px; }
  header .path { color:var(--mut); font-size:12px; }
  main { flex:1; display:flex; min-height:0; position:relative; }
  #left { width:300px; border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #tree { flex:1; overflow:auto; padding:8px; font-size:13px; -webkit-overflow-scrolling:touch; }
  #viewerWrap { flex:1; position:relative; min-width:0; }
  #viewer { width:100%; height:100%; display:block; touch-action:none; }
  #right { width:280px; border-left:1px solid var(--line); padding:14px; overflow:auto; font-size:13px; -webkit-overflow-scrolling:touch; }
  .node { padding:4px 6px; border-radius:5px; cursor:pointer; white-space:nowrap; user-select:none; }
  .node:hover { background:#1c1c22; }
  .node.sel { background:#23304f; }
  .dir { color:var(--mut); font-weight:600; }
  .model::before { content:"▣ "; color:var(--acc); }
  .children { margin-left:14px; border-left:1px solid var(--line); padding-left:6px; }
  label { display:block; color:var(--mut); margin:10px 0 3px; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  input, select, textarea, button { width:100%; background:#1c1c22; border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:7px 9px; font-size:13px; font-family:inherit; }
  textarea { resize:vertical; min-height:54px; }
  button { cursor:pointer; background:#23304f; border-color:#33446e; margin-top:8px; font-weight:600; }
  button:hover { background:#2b3c63; }
  button.ghost { background:#1c1c22; }
  button.danger { background:#3a1d1d; border-color:#5e2b2b; color:var(--danger); }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .empty { color:var(--mut); padding:20px; text-align:center; font-size:13px; }
  .badge { display:inline-block; font-size:10px; color:var(--mut); border:1px solid var(--line); border-radius:4px; padding:1px 5px; }
  #renderer { margin-left:auto; }
  .toast { position:fixed; bottom:max(20px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:#23304f; border:1px solid #33446e; padding:9px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50; max-width:90vw; text-align:center; }
  .toast.show { opacity:1; }

  /* mobile tab bar — hidden on desktop */
  #tabbar { display:none; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  #tabbar button { flex:1; margin:0; border:0; border-radius:0; background:var(--bg); color:var(--mut); padding:14px 6px; font-size:13px; font-weight:600; }
  #tabbar button.active { color:var(--acc); background:#15151b; box-shadow:inset 0 2px 0 var(--acc); }

  /* ───────── phone / narrow: one panel at a time, tab-switched ───────── */
  @media (max-width: 820px) {
    header { padding:10px 12px; }
    header .path { display:none; }
    #left, #viewerWrap, #right {
      position:absolute; inset:0; width:auto; border:0; display:none;
    }
    #left.active { display:flex; }
    #viewerWrap.active { display:block; }
    #right.active { display:block; }
    #tree { font-size:15px; }
    .node { padding:9px 8px; }
    .children { margin-left:10px; }
    /* 16px inputs prevent iOS auto-zoom on focus; bigger tap targets */
    input, select, textarea, button { font-size:16px; padding:11px 12px; }
    #tabbar { display:flex; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<header>
  <h1>Model Scope</h1>
  <span class="path">/shared/assets/models · admin</span>
  <span id="renderer" class="badge">renderer: …</span>
</header>
<main>
  <section id="left" class="active">
    <div style="padding:10px;border-bottom:1px solid var(--line)">
      <label>Generate from prompt</label>
      <textarea id="prompt" placeholder="viking longship with sails"></textarea>
      <div class="row">
        <input id="genName" placeholder="name (optional)" />
        <select id="genCat"></select>
      </div>
      <button id="genBtn">Generate model</button>
    </div>
    <div id="tree"><div class="empty">loading…</div></div>
  </section>
  <section id="viewerWrap">
    <canvas id="viewer"></canvas>
  </section>
  <aside id="right">
    <div id="meta"><div class="empty">Select a model</div></div>
  </aside>
</main>
<nav id="tabbar">
  <button id="tab-browse" class="active">Browse</button>
  <button id="tab-view">View</button>
  <button id="tab-edit">Details</button>
</nav>
<div id="toast" class="toast"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const API = '/blender/api';
const $ = (s) => document.querySelector(s);
let selected = null, current = null, CATS = [];

// ── responsive tabs (only active under the 820px breakpoint) ──
const mq = matchMedia('(max-width: 820px)');
const PANELS = { browse:'#left', view:'#viewerWrap', edit:'#right' };
function setTab(name) {
  for (const [k, sel] of Object.entries(PANELS)) {
    const on = k === name;
    $(sel).classList.toggle('active', on);
    const b = $(`#tab-${k}`); if (b) b.classList.toggle('active', on);
  }
}
for (const k of Object.keys(PANELS)) { const b = $(`#tab-${k}`); if (b) b.onclick = () => setTab(k); }
// keep panels sane when crossing the breakpoint
mq.addEventListener('change', () => { if (!mq.matches) for (const sel of Object.values(PANELS)) $(sel).classList.add('active'); else setTab('browse'); });
if (mq.matches) setTab('browse'); else for (const sel of Object.values(PANELS)) $(sel).classList.add('active');

// ── viewer ──
const canvas = $('#viewer');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d0d12);
const cam = new THREE.PerspectiveCamera(50, 1, 0.01, 1000); cam.position.set(3,2.5,4);
const controls = new OrbitControls(cam, canvas); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(4,6,3); scene.add(key);
const grid = new THREE.GridHelper(10, 10, 0x33446e, 0x1c1c22); scene.add(grid);
const loader = new GLTFLoader();

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) { renderer.setSize(w, h, false); cam.aspect = w/h; cam.updateProjectionMatrix(); }
}
function frameObject(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z) || 1;
  controls.target.copy(center);
  cam.position.copy(center).add(new THREE.Vector3(r*1.6, r*1.2, r*1.8));
  cam.near = r/100; cam.far = r*100; cam.updateProjectionMatrix();
}
function loadModel(url) {
  if (current) { scene.remove(current); current = null; }
  loader.load(url, (g) => { current = g.scene; scene.add(current); frameObject(current); },
    undefined, (e) => toast('load failed: ' + e.message));
}
(function loop(){ requestAnimationFrame(loop); resize(); controls.update(); renderer.render(scene, cam); })();

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2200); }

// ── tree ──
async function refreshTree(selPath) {
  const r = await fetch(`${API}/tree`).then(r=>r.json());
  if (!r.ok) { $('#tree').innerHTML = `<div class="empty">${r.error}</div>`; return; }
  CATS = r.categories;
  const sel = $('#genCat'); sel.innerHTML = CATS.map(c=>`<option>${c}</option>`).join('');
  const host = $('#tree'); host.innerHTML = '';
  if (!r.tree.length) host.innerHTML = '<div class="empty">no models yet</div>';
  for (const n of r.tree) host.appendChild(renderNode(n));
  if (selPath) { const el = host.querySelector(`[data-path="${CSS.escape(selPath)}"]`); if (el) el.click(); }
}
function renderNode(n) {
  const el = document.createElement('div');
  if (n.type === 'dir') {
    const head = document.createElement('div'); head.className = 'node dir'; head.textContent = '▸ ' + n.name;
    const kids = document.createElement('div'); kids.className = 'children';
    for (const c of n.children) kids.appendChild(renderNode(c));
    head.onclick = () => { const open = kids.style.display !== 'none'; kids.style.display = open ? 'none':'block'; head.textContent = (open?'▸ ':'▾ ') + n.name; };
    el.append(head, kids);
  } else {
    const d = document.createElement('div'); d.className = 'node model'; d.dataset.path = n.path;
    d.innerHTML = `${n.name}<span class="badge" style="margin-left:6px">${n.source}</span>`;
    d.onclick = () => { document.querySelectorAll('.node.sel').forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); select(n); };
    el.appendChild(d);
  }
  return el;
}

// ── selection / CRUD ──
async function select(node) {
  loadModel(node.url + '?t=' + Date.now());
  if (mq.matches) setTab('view');          // on phones, jump to the model
  if (!node.id) { $('#meta').innerHTML = `<div class="empty">${node.name}<br><span class="badge">no metadata</span></div>`; selected = null; return; }
  const r = await fetch(`${API}/model/${node.id}`).then(r=>r.json());
  if (!r.ok) return;
  selected = r.model;
  renderMeta(selected);
}
function renderMeta(m) {
  $('#meta').innerHTML = `
    <label>Name</label><input id="mName" value="${esc(m.name||'')}" />
    <label>Category</label><select id="mCat">${CATS.map(c=>`<option ${c===m.category?'selected':''}>${c}</option>`).join('')}</select>
    <label>Tags (comma-sep)</label><input id="mTags" value="${esc((m.tags||[]).join(', '))}" />
    <label>Prompt</label><div class="mut" style="font-size:12px;color:var(--mut)">${esc(m.prompt||'—')}</div>
    <label>Info</label><div class="mut" style="font-size:12px;color:var(--mut)">${m.source} · ${(m.bytes/1024).toFixed(1)} KB${m.triangles?` · ${m.triangles} tris`:''}</div>
    <button id="saveBtn">Save changes</button>
    <a href="${m.url}" download><button class="ghost" type="button">Download .glb</button></a>
    <button id="delBtn" class="danger">Delete model</button>`;
  $('#saveBtn').onclick = async () => {
    const body = { name:$('#mName').value.trim(), category:$('#mCat').value, tags:$('#mTags').value.split(',').map(s=>s.trim()).filter(Boolean) };
    const r = await fetch(`${API}/model/${m._id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }).then(r=>r.json());
    if (r.ok) { toast('saved'); refreshTree(r.model.relpath); } else toast(r.error||'save failed');
  };
  $('#delBtn').onclick = async () => {
    if (!confirm('Delete this model permanently?')) return;
    const r = await fetch(`${API}/model/${m._id}`, { method:'DELETE' }).then(r=>r.json());
    if (r.ok) { toast('deleted'); selected=null; if(current){scene.remove(current);current=null;} $('#meta').innerHTML='<div class="empty">Select a model</div>'; if(mq.matches)setTab('browse'); refreshTree(); } else toast('delete failed');
  };
}

$('#genBtn').onclick = async () => {
  const prompt = $('#prompt').value.trim();
  if (!prompt) return toast('enter a prompt');
  $('#genBtn').disabled = true; $('#genBtn').textContent = 'Generating…';
  const body = { prompt, name:$('#genName').value.trim(), category:$('#genCat').value };
  const r = await fetch(`${API}/generate`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }).then(r=>r.json());
  $('#genBtn').disabled = false; $('#genBtn').textContent = 'Generate model';
  if (r.ok) { toast('created ' + r.model.name); $('#prompt').value=''; refreshTree(r.model.relpath); } else toast(r.error || 'generate failed');
};

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function loadStatus(){try{const r=await fetch(`${API}/status`).then(r=>r.json());const el=document.getElementById("renderer");const m=r.renderer&&r.renderer.mode;el.textContent="renderer: "+(m==="blender-local"?"Blender (local)":m==="blender-remote"?"Blender (remote)":"procedural fallback");const on=m&&m.startsWith("blender");el.style.color=on?"#7c9cff":"#737380";el.style.borderColor=on?"#33446e":"#26262b";}catch(e){}}
loadStatus();
refreshTree();
</script>
</body>
</html>
