<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>tiles.madladslab · scaffold</title>
<style>
  :root { --ink:#e9ecef; --muted:#9fb0a6; --gold:#e3c567; --green:#2fbf71; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#070a08; color:var(--ink); font-family:system-ui,-apple-system,sans-serif; }
  #scene { position:fixed; inset:0; touch-action:none; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #hud > * { pointer-events:auto; }
  #topbar { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:10px; padding:8px 12px;
            background:linear-gradient(#070a08cc,#070a0800); font-size:12.5px; color:var(--muted); }
  #status { flex:1; min-width:0; }
  #status b { color:var(--gold); }
  .iconbtn { width:38px; height:38px; border-radius:10px; background:rgba(17,35,26,.85); color:#cfe7d8; border:1px solid rgba(255,255,255,.14); font-size:16px; cursor:pointer; }
  #badge { position:fixed; left:50%; bottom:34px; transform:translateX(-50%); text-align:center;
           background:rgba(8,18,13,.78); border:1px solid rgba(227,197,103,.45); color:#ffe9a8;
           font-size:13px; font-weight:700; padding:10px 16px; border-radius:12px; max-width:90vw;
           box-shadow:0 10px 34px rgba(0,0,0,.5); }
  #badge small { display:block; color:#9fb0a6; font-weight:400; font-size:11.5px; margin-top:3px; }
  #camhint { position:fixed; left:12px; bottom:14px; font-size:10px; color:#6f8478; pointer-events:none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud">
  <div id="topbar">
    <span id="status">loading…</span>
    <button class="iconbtn" id="resetcam" title="Reset camera">⟲</button>
    <button class="iconbtn" id="mutebtn" title="Mute">🔊</button>
  </div>
  <div id="camhint">drag rotate · 2-finger / right-drag pan · scroll zoom</div>
  <div id="badge">loading scaffold…</div>
</div>
<script type="module" src="/static/js/scaffold3d.js"></script>
</body>
</html>
