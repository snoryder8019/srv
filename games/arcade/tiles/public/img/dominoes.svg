<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="felt" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1d6b4a"/>
      <stop offset="100%" stop-color="#0c3a26"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfdfb"/>
      <stop offset="100%" stop-color="#ece9df"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="18" fill="url(#felt)"/>
  <rect x="8" y="8" width="384" height="284" rx="14" fill="none" stroke="#000" stroke-opacity="0.28" stroke-width="2"/>

  <!-- three dominoes laid in a line -->
  <g filter="url(#sh)" transform="translate(70 150)">
    <!-- bone 1: 6 | 3 -->
    <g>
      <rect x="0" y="-34" width="56" height="68" rx="8" fill="url(#bone)" stroke="#cfcabb"/>
      <line x1="28" y1="-28" x2="28" y2="28" stroke="#cfcabb" stroke-width="2"/>
      <g fill="#15171a">
        <circle cx="11" cy="-24" r="3.4"/><circle cx="11" cy="-13" r="3.4"/><circle cx="11" cy="-2" r="3.4"/>
        <circle cx="11" cy="-24" r="3.4"/>
        <circle cx="11" cy="-24" r="3.4"/>
        <!-- 6 side (left): two columns of 3 -->
        <circle cx="8" cy="-24" r="3.2"/><circle cx="20" cy="-24" r="3.2"/>
        <circle cx="8" cy="-11" r="3.2"/><circle cx="20" cy="-11" r="3.2"/>
        <circle cx="8" cy="2" r="3.2"/><circle cx="20" cy="2" r="3.2"/>
        <!-- 3 side (right): diagonal -->
        <circle cx="36" cy="-20" r="3.2"/><circle cx="42" cy="-2" r="3.2"/><circle cx="48" cy="16" r="3.2"/>
      </g>
    </g>
    <!-- bone 2: 3 | 1 -->
    <g transform="translate(64 0)">
      <rect x="0" y="-34" width="56" height="68" rx="8" fill="url(#bone)" stroke="#cfcabb"/>
      <line x1="28" y1="-28" x2="28" y2="28" stroke="#cfcabb" stroke-width="2"/>
      <g fill="#15171a">
        <circle cx="8" cy="-20" r="3.2"/><circle cx="14" cy="-2" r="3.2"/><circle cx="20" cy="16" r="3.2"/>
        <circle cx="42" cy="-2" r="3.4"/>
      </g>
    </g>
    <!-- bone 3 (double): 1 | 1 crosswise -->
    <g transform="translate(128 0)">
      <rect x="0" y="-34" width="56" height="68" rx="8" fill="url(#bone)" stroke="#cfcabb"/>
      <line x1="28" y1="-28" x2="28" y2="28" stroke="#cfcabb" stroke-width="2"/>
      <g fill="#15171a">
        <circle cx="14" cy="-2" r="3.6"/><circle cx="42" cy="-2" r="3.6"/>
      </g>
    </g>
  </g>

  <text x="200" y="52" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#f3efe0" text-anchor="middle" letter-spacing="3">DOMINOES</text>
  <text x="200" y="262" font-family="system-ui, sans-serif" font-size="13" fill="#bfe0cd" text-anchor="middle" letter-spacing="1">match the ends &#183; empty your hand</text>
</svg>
